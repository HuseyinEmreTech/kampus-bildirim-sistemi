name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    name: sonar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Bağımlılıklar
        run: flutter pub get
      - name: Testler ve kapsam
        run: |
          mkdir -p coverage
          : > coverage/lcov.info
          for pkg in packages/app packages/application packages/contracts packages/domain packages/infrastructure packages/server; do
            if ! find "$pkg/test" -name '*_test.dart' 2>/dev/null | grep -q .; then
              echo "$pkg: test dosyası yok, atlandı"
              continue
            fi
            (cd "$pkg" && flutter test --coverage)
            awk -v p="$pkg" '/^SF:/ { sub(/^SF:/, ""); print "SF:" p "/" $0; next } { print }' "$pkg/coverage/lcov.info" >> coverage/lcov.info
          done
      - name: SonarQube Cloud taraması
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
