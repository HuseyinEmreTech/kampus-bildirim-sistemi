name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    name: sonar
    runs-on: ubuntu-latest
    # db etiketli testler gerçek PostgreSQL ister; bu iş için geçici bir veritabanı.
    # Parola yalnızca bu geçici konteyner içindir, sır değildir.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: ci-test
          POSTGRES_DB: campus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://campus:ci-test@localhost:5432/campus?sslmode=disable&max_connection_count=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/python-report-service/requirements-dev.txt
      - name: Python bağımlılıkları
        working-directory: services/python-report-service
        run: python -m pip install -r requirements-dev.txt
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Bağımlılıklar
        run: flutter pub get
      - name: Python testleri ve kapsam
        working-directory: services/python-report-service
        run: python -m pytest -q --cov=app --cov-report=xml:coverage.xml --cov-report=term
      - name: Veritabanı şeması (migration'lar sırayla)
        env:
          PGPASSWORD: ci-test
        run: |
          for f in $(ls db/migrations/V*.sql | sort -V); do
            psql -h localhost -U campus -d campus -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Testler ve kapsam
        run: |
          mkdir -p coverage
          : > coverage/lcov.info
          for pkg in packages/app packages/application packages/contracts packages/domain packages/infrastructure packages/server; do
            if ! find "$pkg/test" -name '*_test.dart' 2>/dev/null | grep -q .; then
              echo "$pkg: test dosyası yok, atlandı"
              continue
            fi
            (cd "$pkg" && flutter test --coverage)
            awk -v p="$pkg" '/^SF:/ { sub(/^SF:/, ""); print "SF:" p "/" $0; next } { print }' "$pkg/coverage/lcov.info" >> coverage/lcov.info
          done
      - name: SonarQube Cloud taraması
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
