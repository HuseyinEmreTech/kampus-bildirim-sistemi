name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-report-service:
    name: Python report service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/python-report-service/requirements-dev.txt
      - name: Bağımlılıklar
        working-directory: services/python-report-service
        run: python -m pip install -r requirements-dev.txt
      - name: Python servis testleri
        working-directory: services/python-report-service
        run: python -m pytest -q

  kontrol:
    name: kontrol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Orphan/stacked dal kontrolü için tam geçmiş gerekir.
          fetch-depth: 0
      - name: Dal geçmişi (orphan kontrolü)
        run: |
          if ! git merge-base origin/main HEAD >/dev/null 2>&1; then
            echo "::error::Bu dal main ile ortak geçmişe sahip değil (orphan)."
            echo "Dalı main'den yeniden oluşturun; eski bir anlık görüntüyü PR'a taşımayın."
            exit 1
          fi
          echo "Dal main ile ortak geçmişe sahip."
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Bağımlılıklar
        run: flutter pub get
      - name: Biçim
        run: dart format --output=none --set-exit-if-changed .
      - name: Analiz
        run: dart analyze --fatal-infos
      - name: Mimari test
        run: dart test test/architecture_test.dart
      - name: Dart paket testleri
        run: |
          for d in packages/domain packages/application packages/contracts packages/infrastructure packages/server; do
            if find "$d/test" -name '*_test.dart' 2>/dev/null | grep -q .; then
              (cd "$d" && dart test -x bekliyor -x db)
            else
              echo "$d: test dosyası yok, atlandı"
            fi
          done
      - name: Flutter testleri
        working-directory: packages/app
        run: flutter test
