name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-report-service:
    name: Python report service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/python-report-service/requirements-dev.txt
      - name: Bağımlılıklar
        working-directory: services/python-report-service
        run: python -m pip install -r requirements-dev.txt
      - name: Python servis testleri
        working-directory: services/python-report-service
        run: python -m pytest -q

  kontrol:
    name: kontrol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Orphan/stacked dal kontrolü için tam geçmiş gerekir.
          fetch-depth: 0
      - name: Dal geçmişi (orphan kontrolü)
        run: |
          if ! git merge-base origin/main HEAD >/dev/null 2>&1; then
            echo "::error::Bu dal main ile ortak geçmişe sahip değil (orphan)."
            echo "Dalı main'den yeniden oluşturun; eski bir anlık görüntüyü PR'a taşımayın."
            exit 1
          fi
          echo "Dal main ile ortak geçmişe sahip."
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Bağımlılıklar
        run: flutter pub get
      - name: Biçim
        run: dart format --output=none --set-exit-if-changed .
      - name: Analiz
        run: dart analyze --fatal-infos
      - name: Mimari test
        run: dart test test/architecture_test.dart
      - name: Dart paket testleri
        run: |
          for d in packages/domain packages/application packages/contracts packages/infrastructure packages/server; do
            if find "$d/test" -name '*_test.dart' 2>/dev/null | grep -q .; then
              (cd "$d" && dart test -x bekliyor -x db)
            else
              echo "$d: test dosyası yok, atlandı"
            fi
          done
      - name: Flutter testleri
        working-directory: packages/app
        run: flutter test
  # #250: C# servisinin testleri her PR'da çalışır; kırmızıysa PR kırılır.
  rapor-istatistik:
    name: C# rapor-istatistik
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: C# servis testleri
        working-directory: services/rapor-istatistik
        run: dotnet test RaporIstatistik.slnx

  # #250: web/tests/index.html başsız Chrome'da açılır. Testler ES modülü olduğu
  # için sayfa file:// yerine küçük bir HTTP sunucusundan verilir. Sonuç sayfadaki
  # data-result alanından okunur (harness.js: pass / fail).
  web:
    name: Web testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Web istemcisi testleri (başsız tarayıcı)
        working-directory: web
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8000/tests/index.html >/dev/null && break
            sleep 0.5
          done
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=10000 --dump-dom \
            http://localhost:8000/tests/index.html > "$RUNNER_TEMP/web-test.html"
          grep -o '<li class="[a-z]*">[^<]*</li>' "$RUNNER_TEMP/web-test.html" | sed 's/<[^>]*>//g'
          grep -o '<p>[^<]*</p>' "$RUNNER_TEMP/web-test.html" | sed 's/<[^>]*>//g'
          grep -q 'data-result="pass"' "$RUNNER_TEMP/web-test.html"
