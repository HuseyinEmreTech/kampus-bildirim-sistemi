<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Report · Bildirimler</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand">Campus Report</span>
      <span id="kullanici" class="muted"></span>
      <button id="cikis" type="button" class="button button--ghost">Çıkış</button>
    </header>
    <main class="content">
      <h1>Bildirimler</h1>
      <form id="filtreler" class="filters">
        <label>
          Durum
          <select name="status">
            <option value="">Tümü</option>
          </select>
        </label>
        <label>
          Kategori
          <select name="category">
            <option value="">Tümü</option>
          </select>
        </label>
        <label>
          Bina
          <select name="buildingId">
            <option value="">Tümü</option>
          </select>
        </label>
      </form>
      <section id="liste" class="report-list" aria-live="polite"></section>
      <nav id="sayfalama" class="pagination" aria-label="Sayfalama"></nav>
    </main>
    <script type="module" src="js/reports-page.js"></script>
  </body>
</html>
